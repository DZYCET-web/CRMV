<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM DZYCET</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --border-color: #cccccc;
      --primary-color: #0056b3;
      --hover-color: #003d80;
      --light-gray: #f8f9fa;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); line-height: 1.4; }

    header { border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    nav button { background: none; border: none; padding: 8px 16px; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; }
    nav button.active { border-bottom: 2px solid var(--primary-color); color: var(--primary-color); }

    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select, input[type="date"], input[type="number"] {
      border: 1px solid var(--border-color); padding: 6px 10px; font-size: 0.9rem; border-radius: 2px;
    }
    button.btn-primary { background: var(--primary-color); color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 2px; }
    button.btn-primary:hover { background: var(--hover-color); }
    button.btn-secondary { background: white; border: 1px solid var(--border-color); padding: 6px 12px; cursor: pointer; }
    button.btn-danger { background: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
    th { background-color: var(--light-gray); font-weight: 600; }
    tr:hover { background-color: #f1f1f1; cursor: pointer; }

    .drawer { position: fixed; top: 0; right: -500px; width: 480px; height: 100%; background: white; border-left: 1px solid var(--border-color); box-shadow: -2px 0 5px rgba(0,0,0,0.1); transition: right 0.3s ease; padding: 20px; overflow-y: auto; z-index: 1000; }
    .drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; }

    .insumo-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
    .insumo-row select { flex: 2; }
    .insumo-row input { flex: 1; }

    .grid-reports { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { border: 1px solid var(--border-color); padding: 16px; background: white; }
    .card h3 { font-size: 1rem; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    
    /* Corrección de margen y sangrado de listas en informes */
    .card ul {
      padding-left: 24px;
      margin-top: 8px;
    }
    .card ul li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>CRM DZYCET</h1>
    <nav>
      <button class="active" onclick="switchTab('adminScreen', this)">Administración y Logística</button>
      <button onclick="switchTab('reportsScreen', this)">Informes</button>
    </nav>
  </header>

  <main>
    <!-- PANTALLA ADMINISTRACIÓN Y LOGÍSTICA -->
    <section id="adminScreen" class="screen active">
      <div class="toolbar">
        <button class="btn-primary" onclick="openDrawerForCreate()">+ Nueva Solicitud</button>
        <input type="text" id="searchInput" placeholder="Buscar registros..." oninput="renderTable()">
        <select id="filterPatologia" onchange="renderTable()">
          <option value="">Todas las Patologías</option>
          <option value="Chagas">Chagas</option>
          <option value="Leishmaniasis">Leishmaniasis</option>
          <option value="Paludismo">Paludismo</option>
        </select>
        <select id="filterEntregado" onchange="renderTable()">
          <option value="">Todos los Estados</option>
          <option value="true">Entregado: Sí</option>
          <option value="false">Entregado: No</option>
        </select>
        <button class="btn-secondary" onclick="exportFilteredCSV()">Exportar CSV</button>
      </div>

      <table id="dataTable">
        <thead>
          <tr>
            <th>N.º Nota Autorización</th>
            <th>Código Solicitud</th>
            <th>Fecha Sol.</th>
            <th>Patología</th>
            <th>Provincia</th>
            <th>Método Envío</th>
            <th>Fecha Entrega Prog.</th>
            <th>Entregado</th>
            <th>Remito</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <!-- PANTALLA INFORMES -->
    <section id="reportsScreen" class="screen">
      <h2>Informes Consolidados</h2>
      <div class="grid-reports">
        <div class="card">
          <h3>Solicitudes por Patología</h3>
          <ul id="reportPatologia"></ul>
        </div>
        <div class="card">
          <h3>Solicitudes por Provincia</h3>
          <ul id="reportProvincia"></ul>
        </div>
        <div class="card">
          <h3>Estado Logístico</h3>
          <p id="reportPendientes" style="margin-bottom: 6px;"></p>
          <p id="reportEntregados"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- PANEL LATERAL (DRAWER) EDITAR/CREAR -->
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <h3 id="drawerTitle">Registro</h3>
      <button onclick="closeDrawer()">✕</button>
    </div>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <div class="form-group">
        <label>N.º de Nota de Autorización (Ingresar número):</label>
        <input type="text" id="inputNota" required placeholder="Ej: 12345678">
      </div>
      <div class="form-group">
        <label>Código de Solicitud:</label>
        <input type="text" id="inputCodigo">
      </div>
      <div class="form-group">
        <label>Fecha Solicitud:</label>
        <input type="date" id="inputFechaSol">
      </div>
      <div class="form-group">
        <label>Patología:</label>
        <select id="inputPatologia" required>
          <option value="Chagas">Chagas</option>
          <option value="Leishmaniasis">Leishmaniasis</option>
          <option value="Paludismo">Paludismo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Institución Destino:</label>
        <select id="inputInstitucion" required>
          <option value="Hospital">Hospital</option>
          <option value="Programa Provincial">Programa Provincial</option>
          <option value="Epidemiología">Epidemiología</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Provincia:</label>
        <select id="inputProvincia" required></select>
      </div>

      <div class="form-group">
        <label>Insumos (máx. 6):</label>
        <div id="insumosContainer"></div>
        <button type="button" class="btn-secondary" style="margin-top:6px;" onclick="addInsumoRow()">+ Agregar Insumo</button>
      </div>

      <hr style="margin: 16px 0;">

      <div class="form-group">
        <label>Método de Envío:</label>
        <select id="inputMetodoEnvio">
          <option value="">Seleccione...</option>
          <option value="Operador Logístico Suizo desde Andreani">Operador Logístico Suizo desde Andreani</option>
          <option value="Operador Logístico Suizo desde Brandsen">Operador Logístico Suizo desde Brandsen</option>
          <option value="Personalmente">Personalmente</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha Entrega Programada:</label>
        <input type="date" id="inputFechaEntrega">
      </div>
      <div class="form-group">
        <label>Se Entregó:</label>
        <select id="inputEntregado">
          <option value="false">No</option>
          <option value="true">Sí</option>
        </select>
      </div>
      <div class="form-group">
        <label>N.º Remito SMIS:</label>
        <input type="text" id="inputRemito">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn-primary" style="flex: 1;">Guardar</button>
        <button type="button" class="btn-danger" id="btnDelete" onclick="deleteCurrentRecord()" style="display:none;">Eliminar</button>
      </div>
    </form>
  </aside>

  <script>
    const PROVINCIAS = [
      "PROVINCIA BUENOS AIRES", "CAPITAL FEDERAL", "CATAMARCA", "CHACO", "CHUBUT", "CÓRDOBA", 
      "CORRIENTES", "ENTRE RÍOS", "FORMOSA", "JUJUY", "LA PAMPA", "LA RIOJA", "MENDOZA", 
      "MISIONES", "NEUQUÉN", "RÍO NEGRO", "SALTA", "SAN JUAN", "SAN LUIS", "SANTA CRUZ", 
      "SANTA FE", "SANTIAGO DEL ESTERO", "TIERRA DEL FUEGO", "TUCUMÁN"
    ];

    const INSUMOS_OPTIONS = [
      "Bz50", "Bz100", "Bz12,5", "Nif30", "Nif120", "Anfotericina", "Glucantime", 
      "Milte10", "Milte50", "Prima5", "Cloro", "Artemeter", "Artesunato"
    ];

    let records = JSON.parse(localStorage.getItem('dzycet_records') || '[]');
    let currentEditIndex = null;

    function init() {
      const provSelect = document.getElementById('inputProvincia');
      PROVINCIAS.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        provSelect.appendChild(opt);
      });
      renderTable();
    }

    function formatNota(val) {
      if (!val) return '';
      if (val.startsWith('NO-2026-')) return val;
      const numOnly = val.replace(/\D/g, '');
      return `NO-2026-${numOnly.padStart(8, '0')}-APN-DZYCETV#MS`;
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const filtered = getFilteredRecords();

      filtered.forEach((rec) => {
        const tr = document.createElement('tr');
        tr.onclick = () => openDrawerForEdit(records.indexOf(rec));
        tr.innerHTML = `
          <td>${rec['Nro Nota Autoriza'] || ''}</td>
          <td>${rec['Codigo de Solicitud'] || ''}</td>
          <td>${rec['Fecha Solicitud'] || ''}</td>
          <td>${rec['Patologia'] || ''}</td>
          <td>${rec['Provincia'] || ''}</td>
          <td>${rec['Metodo de envio'] || ''}</td>
          <td>${rec['Fecha de entrega programada'] || ''}</td>
          <td>${rec['Entregado'] ? 'Sí' : 'No'}</td>
          <td>${rec['Remito SMIS'] || ''}</td>
        `;
        tbody.appendChild(tr);
      });

      renderReports();
    }

    function getFilteredRecords() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const pat = document.getElementById('filterPatologia').value;
      const ent = document.getElementById('filterEntregado').value;

      return records.filter(rec => {
        const matchesSearch = Object.values(rec).some(v => String(v).toLowerCase().includes(search));
        const matchesPat = !pat || rec.Patologia === pat;
        const matchesEnt = !ent || String(rec.Entregado) === ent;
        return matchesSearch && matchesPat && matchesEnt;
      });
    }

    function addInsumoRow(insumo = '', cantidad = '') {
      const container = document.getElementById('insumosContainer');
      if (container.children.length >= 6) return;

      const div = document.createElement('div');
      div.className = 'insumo-row';
      div.innerHTML = `
        <select required>
          <option value="">Seleccionar Insumo...</option>
          ${INSUMOS_OPTIONS.map(i => `<option value="${i}" ${i === insumo ? 'selected' : ''}>${i}</option>`).join('')}
        </select>
        <input type="number" min="1" placeholder="Cant." value="${cantidad}" required>
        <button type="button" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function openDrawerForCreate() {
      currentEditIndex = null;
      document.getElementById('recordForm').reset();
      document.getElementById('insumosContainer').innerHTML = '';
      document.getElementById('btnDelete').style.display = 'none';
      document.getElementById('drawerTitle').textContent = 'Nueva Solicitud';
      document.getElementById('drawer').classList.add('open');
    }

    function openDrawerForEdit(index) {
      currentEditIndex = index;
      const rec = records[index];
      document.getElementById('drawerTitle').textContent = 'Editar Solicitud';
      document.getElementById('inputNota').value = rec['Nro Nota Autoriza'] || '';
      document.getElementById('inputCodigo').value = rec['Codigo de Solicitud'] || '';
      document.getElementById('inputFechaSol').value = rec['Fecha Solicitud'] || '';
      document.getElementById('inputPatologia').value = rec['Patologia'] || 'Chagas';
      document.getElementById('inputInstitucion').value = rec['Institucion Destino'] || 'Hospital';
      document.getElementById('inputProvincia').value = rec['Provincia'] || PROVINCIAS[0];
      document.getElementById('inputMetodoEnvio').value = rec['Metodo de envio'] || '';
      document.getElementById('inputFechaEntrega').value = rec['Fecha de entrega programada'] || '';
      document.getElementById('inputEntregado').value = rec['Entregado'] ? 'true' : 'false';
      document.getElementById('inputRemito').value = rec['Remito SMIS'] || '';

      const container = document.getElementById('insumosContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 6; i++) {
        if (rec[`Insumo ${i}`]) {
          addInsumoRow(rec[`Insumo ${i}`], rec[`Cantidad ${i}`]);
        }
      }

      document.getElementById('btnDelete').style.display = 'block';
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function saveRecord(event) {
      if (event) event.preventDefault();

      // Mapeo seguro de insumos (hasta 6)
      const insumoRows = document.querySelectorAll('#insumosContainer .insumo-row');
      const insumosData = {};
      
      for (let i = 0; i < 6; i++) {
        if (insumoRows[i]) {
          insumosData[`Insumo ${i + 1}`] = insumoRows[i].querySelector('select').value;
          insumosData[`Cantidad ${i + 1}`] = insumoRows[i].querySelector('input').value;
        } else {
          insumosData[`Insumo ${i + 1}`] = '';
          insumosData[`Cantidad ${i + 1}`] = '';
        }
      }

      const newRec = {
        'Nro Nota Autoriza': formatNota(document.getElementById('inputNota').value),
        'Codigo de Solicitud': document.getElementById('inputCodigo').value,
        'Fecha Solicitud': document.getElementById('inputFechaSol').value,
        'Patologia': document.getElementById('inputPatologia').value,
        'Institucion Destino': document.getElementById('inputInstitucion').value,
        'Provincia': document.getElementById('inputProvincia').value,
        ...insumosData,
        'Metodo de envio': document.getElementById('inputMetodoEnvio').value,
        'Fecha de entrega programada': document.getElementById('inputFechaEntrega').value,
        'Entregado': document.getElementById('inputEntregado').value === 'true',
        'Remito SMIS': document.getElementById('inputRemito').value
      };

      if (currentEditIndex !== null) {
        records[currentEditIndex] = newRec;
      } else {
        records.push(newRec);
      }

      localStorage.setItem('dzycet_records', JSON.stringify(records));

      // Envío a Google Apps Script
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbydmLoc8w2sllnr2p1Vn0lVviDU4HsXKc5Rs62I7_KhovNMrTxEqshOEKLVF2zdctbfLg/exec';
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(newRec)
      })
      .then(() => alert('Registro guardado exitosamente'))
      .catch(err => alert('Error enviando a Apps Script: ' + err));

      closeDrawer();
      renderTable();
    }

    function deleteCurrentRecord() {
      if (currentEditIndex !== null && confirm('¿Desea eliminar esta solicitud?')) {
        records.splice(currentEditIndex, 1);
        localStorage.setItem('dzycet_records', JSON.stringify(records));
        closeDrawer();
        renderTable();
      }
    }

    function renderReports() {
      const filtered = getFilteredRecords();
      
      const patCounts = {};
      const provCounts = {};
      let pend = 0, ent = 0;

      filtered.forEach(r => {
        patCounts[r.Patologia] = (patCounts[r.Patologia] || 0) + 1;
        provCounts[r.Provincia] = (provCounts[r.Provincia] || 0) + 1;
        if (r.Entregado) ent++; else pend++;
      });

      document.getElementById('reportPatologia').innerHTML = Object.entries(patCounts)
        .map(([k, v]) => `<li><b>${k}:</b> ${v}</li>`).join('') || 'Sin datos';

      document.getElementById('reportProvincia').innerHTML = Object.entries(provCounts)
        .map(([k, v]) => `<li><b>${k}:</b> ${v}</li>`).join('') || 'Sin datos';

      document.getElementById('reportPendientes').textContent = `Tareas Pendientes de Entrega: ${pend}`;
      document.getElementById('reportEntregados').textContent = `Entregas Completadas: ${ent}`;
    }

    function exportFilteredCSV() {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) return alert('No hay registros para exportar.');

      const headers = [
        "Nro Nota Autoriza","Codigo de Solicitud","Fecha Solicitud","Patologia","Institucion Destino",
        "Provincia","Insumo 1","Cantidad 1","Insumo 2","Cantidad 2","Insumo 3","Cantidad 3",
        "Insumo 4","Cantidad 4","Insumo 5","Cantidad 5","Insumo 6","Cantidad 6",
        "Metodo de envio","Fecha de entrega programada","Entregado","Remito SMIS"
      ];

      const csvRows = [headers.join(',')];

      filtered.forEach(r => {
        const values = headers.map(h => {
          const val = r[h] !== undefined ? r[h] : '';
          return `"${String(val).replace(/"/g, '""')}"`;
        });
        csvRows.push(values.join(','));
      });

      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `CRM_DZYCET_export_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function switchTab(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      btn.classList.add('active');
    }

    init();
  </script>
</body>
</html>
